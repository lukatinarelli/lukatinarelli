name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 4 * * *" # Se ejecuta todos los días a las 04:00
  workflow_dispatch: # Permite ejecutarlo manualmente desde Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generar Estadísticas Generales
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&locale=en
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          path: profile/stats.svg

      - name: Generar Lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&locale=en&layout=compact
          token: ${{ secrets.TOKEN_GITHUB }}
          path: profile/top-langs.svg

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "Actualizar github stats" || exit 0
          git push
